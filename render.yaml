services:
  - type: web
    name: lm-compliance-api
    runtime: python
    # Runs inside the 512 MB of Render's free instance type. See
    # requirements-ocr.txt for why that install is a separate --no-deps step.
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install --no-deps -r requirements-ocr.txt
    # One worker, and a concurrency cap so a burst of uploads queues instead
    # of peaking all at once and getting the worker OOM-killed.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 8
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: label-images
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_ADMIN_NAME
        value: Chief Inspector
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Leave blank unless you have a vision-capable model. GROQ_MODEL above
      # is text-only: pointing this at it rejects every scan with
      # "400 ... messages[0].content must be a string". Blank simply turns
      # the optional photo-review assist off - OCR plus GROQ_MODEL still
      # identify the product and write the report summary.
      - key: GROQ_VISION_MODEL
        value: ""
